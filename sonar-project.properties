# SonarQube Cloud analysis of Atmos, run by the Jenkinsfile (stage "Code analysis").
# The token comes from Jenkins (credential sonar-token); the branch name from the build.
sonar.host.url=https://sonarcloud.io
sonar.organization=kernel-club
sonar.projectKey=Kernel-Club_atmos-dev
sonar.projectName=atmos-dev

# Application code and tests
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests
sonar.python.version=3.12

# Test coverage of the backend, written by pytest in the stage "Backend: lint and tests"
sonar.python.coverage.reportPaths=backend/coverage.xml

# The scanner waits for the quality gate and fails when it is not passed:
# SonarQube Cloud cannot call back the local Jenkins with a webhook.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
