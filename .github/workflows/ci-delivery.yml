name: CI-Delivery

# ================================= WARNING ===================================
# MANUAL START ONLY. The whole pipeline runs only by hand.
#
# This repository is shared by two platforms:
#   - cloud:   GitHub Actions (this file) -> Docker Hub -> project-atmos-k8s
#   - on-prem: Jenkins (project-atmos-onprem-jenkins) -> Nexus -> Flux
#
# The cloud environment is destroyed when not in use, so push and
# pull_request triggers are DISABLED. Nothing in this file starts
# automatically: no lint, no tests, no build, no delivery.
#
# Start it by hand: Actions -> CI-Delivery -> Run workflow (pick a branch).
# Delivery (push to Docker Hub + trigger k8s) runs only on develop.
#
# To turn automatic runs back on: uncomment push / pull_request below.
# =============================================================================
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #     - develop
  # pull_request:
  #   branches:
  #     - main
  #     - develop

permissions:
  contents: read

env:
  APP_VERSION: v1.0.0
  K8S_REPO: ${{ github.repository_owner }}/${{ vars.PROJECT_NAME }}-k8s
  BACKEND_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.PROJECT_NAME }}-backend
  FRONTEND_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.PROJECT_NAME }}-frontend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: ruff check .

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest

  build:
    # Only builds the images (checks that the Dockerfiles work). On develop
    # (push or manual run) the images are saved as an artifact for delivery.
    name: Build images
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    env:
      SAVE_IMAGES: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend.Dockerfile
          tags: backend:build
          outputs: type=docker,dest=${{ runner.temp }}/backend.tar

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend.Dockerfile
          tags: frontend:build
          outputs: type=docker,dest=${{ runner.temp }}/frontend.tar

      - name: Save images for delivery
        if: env.SAVE_IMAGES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: |
            ${{ runner.temp }}/backend.tar
            ${{ runner.temp }}/frontend.tar
          retention-days: 1

  delivery:
    # Tags the images, pushes them to Docker Hub and triggers the k8s pipeline.
    name: Tag, push and trigger k8s
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'

    steps:
      - name: Set image tag
        shell: bash
        run: |
          echo "IMAGE_TAG=${APP_VERSION}-${GITHUB_SHA::6}" >> "$GITHUB_ENV"

      - name: Get the built images
        uses: actions/download-artifact@v4
        with:
          name: images
          path: ${{ runner.temp }}

      - name: Load and tag images
        run: |
          docker load -i "${RUNNER_TEMP}/backend.tar"
          docker load -i "${RUNNER_TEMP}/frontend.tar"
          docker tag backend:build "${BACKEND_IMAGE}:${IMAGE_TAG}"
          docker tag frontend:build "${FRONTEND_IMAGE}:${IMAGE_TAG}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images
        run: |
          docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"
          docker push "${FRONTEND_IMAGE}:${IMAGE_TAG}"

      - name: Trigger k8s repo pipeline
        env:
          GH_TOKEN: ${{ secrets.K8S_REPO_TOKEN }}
        run: |
          gh api "repos/${K8S_REPO}/dispatches" \
            -f event_type=deploy \
            -f "client_payload[image_tag]=${IMAGE_TAG}"
